name: Build ALLTOOLS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ALLTOOLS_ANDROID_SOURCE.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled:  true
          cache-provider: basic

      - name: Unpack ALLTOOLS Android source
        run: |
          test -f ALLTOOLS_ANDROID_SOURCE.zip
          mkdir -p build-source
          unzip -q ALLTOOLS_ANDROID_SOURCE.zip -d build-source
          test -f build-source/ALLTOOLS_ANDROID/settings.gradle

      - name: Build debug APK
        run: gradle -p build-source/ALLTOOLS_ANDROID :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLTOOLS-debug-APK
          path: build-source/ALLTOOLS_ANDROID/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
